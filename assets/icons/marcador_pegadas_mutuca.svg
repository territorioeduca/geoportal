<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="36" viewBox="0 0 32 36">
  <title>Roteiro Ecopedagógico da Mutuca - Pegadas</title>
  <defs>
    <filter id="sombra-verde" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0E2E1F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Marcador Pin Verde #29865B -->
  <path d="M16 2 C9.37 2 4 7.37 4 14 C4 22.5 16 34 16 34 C16 34 28 22.5 28 14 C28 7.37 22.63 2 16 2 Z"
        fill="#29865B" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" filter="url(#sombra-verde)"/>
  <!-- Ícone estilizado de pegadas / pegada ecológica -->
  <!-- Pegada esquerda -->
  <ellipse cx="12" cy="18" rx="2" ry="3" transform="rotate(-15 12 18)" fill="#FFFFFF"/>
  <circle cx="10" cy="13.5" r="0.8" fill="#FFFFFF"/>
  <circle cx="11.8" cy="13" r="0.8" fill="#FFFFFF"/>
  <circle cx="13.5" cy="13.5" r="0.7" fill="#FFFFFF"/>
  <!-- Pegada direita (ligeiramente à frente) -->
  <ellipse cx="18.5" cy="13.5" rx="2" ry="3" transform="rotate(15 18.5 13.5)" fill="#FFFFFF"/>
  <circle cx="17" cy="9" r="0.8" fill="#FFFFFF"/>
  <circle cx="18.8" cy="8.5" r="0.8" fill="#FFFFFF"/>
  <circle cx="20.5" cy="9" r="0.7" fill="#FFFFFF"/>
</svg>
