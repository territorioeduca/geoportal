<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="40"
     viewBox="0 0 64 40">
  <title>Grupos de pesca artesanal</title>
  <desc>Peixe de perfil para uso como marcador cartográfico no QGIS.</desc>

  <!-- Corpo e cauda em uma única silhueta, legível mesmo em tamanho pequeno. -->
  <path
    d="M61 6
       C55 9 50 13 47 16
       C39 9 29 7 20 10
       C12 12 6 16 3 20
       C6 24 12 28 20 30
       C29 33 39 31 47 24
       C50 27 55 31 61 34
       C59 28 58 24 58 20
       C58 16 59 12 61 6 Z"
    fill="#173B57"
    stroke="#FFFFFF"
    stroke-width="2.4"
    stroke-linejoin="round"/>

  <!-- Olho simples, com alto contraste. -->
  <circle cx="17" cy="17" r="2.2"
          fill="#FFFFFF"
          stroke="#173B57"
          stroke-width="0.8"/>

  <!-- Pequeno detalhe de guelra para reforçar a leitura como peixe. -->
  <path d="M24 13 C21 17 21 23 24 27"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.9"/>
</svg>
